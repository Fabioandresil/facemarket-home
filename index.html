<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FaceMarket</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green: #3B6D11; --green-light: #EAF3DE; --green-mid: #639922;
  --text: #2C2C2A; --text-muted: #5F5E5A;
  --bg: #fff; --bg2: #F1EFE8; --border: rgba(0,0,0,0.12); --r: 10px;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg2); color: var(--text); min-height: 100vh; padding-bottom: 84px; }

nav { background: var(--bg); border-bottom: 0.5px solid var(--border); position: sticky; top: 0; z-index: 100; }
.nav-inner { display: flex; align-items: center; justify-content: space-between; padding: 0 12px; height: 52px; }
.logo { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--green); text-decoration: none; flex-shrink: 0; }
.logo svg { width: 20px; height: 20px; }
.tabs { display: flex; gap: 3px; }
.tab { padding: 5px 11px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer; border: none; background: transparent; color: var(--text-muted); white-space: nowrap; }
.tab.active { background: var(--green-light); color: var(--green); }

.hcard { background: var(--green); border-radius: var(--r); padding: 16px; color: #fff; margin-bottom: 14px; }
.hcard h1 { font-size: 17px; font-weight: 700; margin-bottom: 3px; }
.hcard p { font-size: 13px; opacity: 0.82; }
.week-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.week-row label { font-size: 12px; opacity: 0.85; }
.week-row input[type=text] { background: rgba(255,255,255,0.2); border: 0.5px solid rgba(255,255,255,0.35); border-radius: 6px; padding: 4px 8px; font-size: 13px; color: #fff; width: 108px; }
.week-row input[type=text]::placeholder { color: rgba(255,255,255,0.5); }

.cbar { display: flex; align-items: center; justify-content: space-between; background: var(--bg); border-radius: var(--r); padding: 11px 14px; margin-bottom: 12px; border: 0.5px solid var(--border); }
.cbar span { font-size: 13px; color: var(--text-muted); }
.cbar strong { color: var(--green); }
.btn-clr { font-size: 12px; color: #A32D2D; background: none; border: none; cursor: pointer; padding: 4px 8px; border-radius: 6px; }

.cat-block { margin-bottom: 12px; }
.cat-hdr { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--bg2); border-radius: 8px 8px 0 0; border: 0.5px solid var(--border); border-bottom: none; }
.cat-hdr span { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; }
.cat-count { margin-left: auto; font-size: 11px; background: var(--green-light); color: var(--green); padding: 2px 7px; border-radius: 10px; font-weight: 700; }
.cat-items { background: var(--bg); border: 0.5px solid var(--border); border-radius: 0 0 8px 8px; overflow: hidden; }

.item-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 0.5px solid var(--border); -webkit-tap-highlight-color: transparent; }
.item-row:last-child { border-bottom: none; }
.item-row.chk { opacity: 0.42; }
.item-row.chk .iname { text-decoration: line-through; }
.icheck { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--border); background: var(--bg); flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.item-row.chk .icheck { background: var(--green); border-color: var(--green); }
.icheck svg { display: none; }
.item-row.chk .icheck svg { display: block; }
.iname { font-size: 14px; font-weight: 500; flex: 1; cursor: pointer; min-width: 0; }
.iqty-input { width: 90px; flex-shrink: 0; font-size: 12px; color: var(--text-muted); background: var(--bg2); border: 0.5px solid var(--border); border-radius: 6px; padding: 4px 7px; text-align: center; font-family: inherit; }
.iqty-input:focus { outline: none; border-color: var(--green-mid); color: var(--text); background: var(--bg); }

.abar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); border-top: 0.5px solid var(--border); padding: 10px 16px; display: flex; gap: 10px; }
.btn { flex: 1; padding: 13px; border-radius: var(--r); font-size: 14px; font-weight: 600; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn:active { opacity: 0.8; }
.btn-wa { background: #25D366; color: #fff; }
.btn-pr { background: var(--green-light); color: var(--green); }

/* REFEIÇÕES */
.dias-fixos { background: var(--bg); border-radius: var(--r); border: 0.5px solid var(--border); padding: 12px 14px; margin-bottom: 14px; }
.dias-fixos p { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 10px; }
.dias-bar { display: flex; gap: 6px; }
.dia-btn { flex: 1; padding: 8px 4px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; border: 1px solid var(--border); background: var(--bg2); color: var(--text-muted); text-align: center; }
.dia-btn.sel { background: var(--green); color: #fff; border-color: var(--green); }
.ref-section { margin-bottom: 12px; }
.ref-section-hdr { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--green); color: #fff; border-radius: 8px 8px 0 0; }
.ref-section-hdr h2 { font-size: 14px; font-weight: 700; }
.ref-count { margin-left: auto; font-size: 11px; background: rgba(255,255,255,0.25); padding: 2px 8px; border-radius: 10px; font-weight: 700; }
.ref-items { background: var(--bg); border: 0.5px solid var(--border); border-top: none; border-radius: 0 0 8px 8px; overflow: hidden; }
.ref-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 0.5px solid var(--border); cursor: pointer; -webkit-tap-highlight-color: transparent; }
.ref-item:last-child { border-bottom: none; }
.ref-item:active { background: var(--bg2); }
.dias-pills { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
.dia-pill { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 8px; background: var(--green-light); color: var(--green); }
.gerar-btn { width: 100%; padding: 14px; background: var(--green); color: #fff; border: none; border-radius: var(--r); font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 14px; }
.gerar-btn:active { opacity: 0.85; }

/* ── AGENDA ── */
.agenda-wrap { overflow-x: auto; border-radius: var(--r); border: 0.5px solid var(--border); background: var(--bg); margin-bottom: 14px; }
.agenda-table { width: 100%; border-collapse: collapse; min-width: 480px; }
.agenda-table th { background: var(--green); color: #fff; font-size: 12px; font-weight: 700; padding: 9px 6px; text-align: center; border-right: 0.5px solid rgba(255,255,255,0.2); }
.agenda-table th:first-child { text-align: left; padding-left: 12px; width: 90px; border-right: 0.5px solid rgba(255,255,255,0.3); }
.agenda-table td { border-bottom: 0.5px solid var(--border); border-right: 0.5px solid var(--border); padding: 7px 6px; vertical-align: top; font-size: 11px; min-width: 70px; }
.agenda-table td:first-child { font-size: 12px; font-weight: 700; color: var(--text-muted); background: var(--bg2); padding-left: 12px; white-space: nowrap; }
.agenda-table tr:last-child td { border-bottom: none; }
.agenda-item { background: var(--green-light); color: var(--green); border-radius: 4px; padding: 2px 5px; margin: 2px 0; font-size: 10px; font-weight: 600; line-height: 1.4; display: block; }
.agenda-empty { color: var(--border); font-size: 11px; text-align: center; padding: 4px 0; }

/* PRINT */
@media print {
  nav, .abar, .btn-clr, .week-row input, .gerar-btn, .dias-fixos { display: none !important; }
  body { background: #fff; padding: 0; }

  /* Compras — só itens marcados */
  .item-row:not(.chk) { display: none !important; }
  .item-row.chk { opacity: 1; }
  .item-row.chk .iname { text-decoration: none; font-weight: 600; }
  .icheck { border: 1.5px solid #3B6D11 !important; background: #fff !important; position: relative; }
  .item-row.chk .icheck::after { content: "✓"; position: absolute; font-size: 13px; font-weight: 700; color: #3B6D11; top: 50%; left: 50%; transform: translate(-50%, -50%); }
  .item-row.chk .icheck svg { display: none !important; }
  .iqty-input { border: none; background: transparent; font-weight: 600; color: #2C2C2A; }
  .cat-block:not(:has(.item-row.chk)) { display: none !important; }

  /* Agenda — imprime bem */
  .agenda-wrap { overflow: visible; border: 1px solid #ccc; }
  .agenda-table { min-width: 100%; }
  .agenda-table th { background: #3B6D11 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .agenda-item { background: #EAF3DE !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>

    {n:"Alface",q:"1 unidade"},{n:"Cenoura",q:"3 unidades"},
    {n:"Beterraba",q:"2 unidades"},
  ]},
  { cat: "🍎 Frutas", items: [
    {n:"Manga",q:"3 unidades"},{n:"Mamão",q:"3 unidades"},
    {n:"Maçã",q:"4 unidades"},{n:"Uva",q:"2 cachos"},
    {n:"Ameixa",q:"4 unidades"},{n:"Morango",q:"2 pratos"},
    {n:"Pêra",q:"4 unidades"},{n:"Cereja",q:"1 pacote"},
    {n:"Banana",q:"6 unidades"},{n:"Abacate",q:"2 unidades"},
  ]},
];

const DIAS = ["Seg","Ter","Qua","Qui","Sex","Sáb"];
const REFEICOES = [
  { ref: "☀️ Café da manhã", items: [
    "Panquequinha","Pão forma integral","Cuscuz","Tapioca",
    "Ovos mexidos com queijo","Ovos mexidos com queijo e presunto",
    "Manga","Mamão","Maçã","Uva","Ameixa","Morango","Pêra","Cereja","Banana","Abacate"
  ]},
  { ref: "🍽️ Almoço", items: [
    "Arroz","Feijão","Macarrão","Strogonoff de peito de frango",
    "Carne moída","Filé suíno","Peito de frango","Filé mignon","Músculo",
    "Abóbora","Couve-flor","Brócolis","Batata-doce","Alface","Cenoura","Beterraba",
    "Manga","Mamão","Maçã","Uva","Ameixa","Morango","Pêra","Cereja","Banana"
  ]},
  { ref: "🌙 Jantar", items: [
    "Arroz","Feijão","Macarrão","Strogonoff de peito de frango",
    "Carne moída","Filé suíno","Peito de frango","Filé mignon","Músculo",
    "Abóbora","Couve-flor","Brócolis","Batata-doce","Alface","Cenoura","Beterraba",
    "Manga","Mamão","Maçã","Uva","Ameixa","Morango","Pêra","Cereja","Banana","Abacate"
  ]},
];

const checked = new Set();
const qtys = {};
const refSel = REFEICOES.map(r => r.items.map(() => new Set()));
let diaAtivo = 0;

function getQty(ci, ii) {
  const k = `${ci}-${ii}`;
  return qtys[k] !== undefined ? qtys[k] : COMPRAS[ci].items[ii].q;
}

/* ── COMPRAS ── */
function renderCompras() {
  const c = document.getElementById('lista-container');
  c.innerHTML = '';
  let total = 0;
  COMPRAS.forEach((cat, ci) => {
    total += cat.items.length;
    const marcados = cat.items.filter((_,ii) => checked.has(`${ci}-${ii}`)).length;
    const blk = document.createElement('div'); blk.className = 'cat-block';
    blk.innerHTML = `<div class="cat-hdr"><span>${cat.cat}</span><span class="cat-count">${marcados}/${cat.items.length}</span></div>`;
    const itens = document.createElement('div'); itens.className = 'cat-items';
    cat.items.forEach((item, ii) => {
      const k = `${ci}-${ii}`;
      const isChk = checked.has(k);
      const row = document.createElement('div');
      row.className = 'item-row' + (isChk ? ' chk' : '');
      row.innerHTML = `
        <div class="icheck"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
        <div class="iname">${item.n}</div>
        <input class="iqty-input" type="text" value="${getQty(ci,ii)}" placeholder="qtd">
      `;
      row.querySelector('.icheck').onclick = () => toggle(k);
      row.querySelector('.iname').onclick  = () => toggle(k);
      row.querySelector('.iqty-input').oninput = (e) => { qtys[k] = e.target.value; };
      row.querySelector('.iqty-input').onclick  = (e) => e.stopPropagation();
      itens.appendChild(row);
    });
    blk.appendChild(itens); c.appendChild(blk);
  });
  document.getElementById('cc').textContent = checked.size;
  document.getElementById('ct').textContent = total;
}

function toggle(k) { checked.has(k) ? checked.delete(k) : checked.add(k); renderCompras(); }
function clearAll() {
  if (!checked.size) return;
  if (confirm('Limpar todos os itens marcados?')) { checked.clear(); renderCompras(); }
}

/* ── REFEIÇÕES ── */
function renderDias() {
  const bar = document.getElementById('dias-bar');
  bar.innerHTML = '';
  DIAS.forEach((d, di) => {
    const btn = document.createElement('button');
    btn.className = 'dia-btn' + (diaAtivo === di ? ' sel' : '');
    btn.textContent = d;
    btn.onclick = () => { diaAtivo = di; renderDias(); renderRefeicoes(); };
    bar.appendChild(btn);
  });
}

function renderRefeicoes() {
  const c = document.getElementById('ref-container');
  c.innerHTML = '';
  REFEICOES.forEach((sec, ri) => {
    const totalMarcados = refSel[ri].reduce((a,s) => a + s.size, 0);
    const blk = document.createElement('div'); blk.className = 'ref-section';
    blk.innerHTML = `<div class="ref-section-hdr"><h2>${sec.ref}</h2><span class="ref-count">${totalMarcados} marcações</span></div>`;
    const itensDiv = document.createElement('div'); itensDiv.className = 'ref-items';
    sec.items.forEach((item, ii) => {
      const sel = refSel[ri][ii];
      const marcado = sel.has(diaAtivo);
      const pillsHtml = [...sel].sort((a,b)=>a-b).map(di => `<span class="dia-pill">${DIAS[di]}</span>`).join('');
      const row = document.createElement('div'); row.className = 'ref-item';
      row.innerHTML = `
        <div class="icheck" style="${marcado ? 'background:var(--green);border-color:var(--green)' : ''}">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="display:${marcado?'block':'none'}"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div style="flex:1">
          <div class="iname">${item}</div>
          ${pillsHtml ? `<div class="dias-pills">${pillsHtml}</div>` : ''}
        </div>`;
      row.onclick = () => { sel.has(diaAtivo) ? sel.delete(diaAtivo) : sel.add(diaAtivo); renderRefeicoes(); renderAgenda(); };
      itensDiv.appendChild(row);
    });
    blk.appendChild(itensDiv);
    c.appendChild(blk);
  });
}

function gerarListaDeRefeicoes() {
  const itensNecessarios = new Set();
  REFEICOES.forEach((sec, ri) => {
    sec.items.forEach((item, ii) => { if (refSel[ri][ii].size > 0) itensNecessarios.add(item.toLowerCase()); });
  });
  if (!itensNecessarios.size) { alert('Marque pelo menos um item nas refeições primeiro.'); return; }
  let marcados = 0;
  COMPRAS.forEach((cat, ci) => {
    cat.items.forEach((item, ii) => {
      if (itensNecessarios.has(item.n.toLowerCase())) { checked.add(`${ci}-${ii}`); marcados++; }
    });
  });
  showTab('compras', document.querySelectorAll('.tab')[0]);
  alert(`${marcados} itens adicionados à lista de compras!`);
}

/* ── AGENDA ── */
function renderAgenda() {
  const thead = document.querySelector('#agenda-table thead');
  const tbody = document.querySelector('#agenda-table tbody');

  // Cabeçalho: Refeição + dias
  thead.innerHTML = `<tr>
    <th>Refeição</th>
    ${DIAS.map(d => `<th>${d}</th>`).join('')}
  </tr>`;

  // Linhas: uma por refeição
  tbody.innerHTML = '';
  REFEICOES.forEach((sec, ri) => {
    const tr = document.createElement('tr');
    // Célula do nome da refeição
    const tdNome = document.createElement('td');
    tdNome.textContent = sec.ref;
    tr.appendChild(tdNome);

    // Células dos dias
    DIAS.forEach((_, di) => {
      const td = document.createElement('td');
      const itens = sec.items.filter((_,ii) => refSel[ri][ii].has(di));
      if (itens.length) {
        itens.forEach(item => {
          const span = document.createElement('span');
          span.className = 'agenda-item';
          span.textContent = item;
          td.appendChild(span);
        });
      } else {
        td.innerHTML = '<span class="agenda-empty">—</span>';
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

/* ── WHATSAPP ── */
function waCompras() {
  const ini = document.getElementById('ini').value;
  const fim = document.getElementById('fim').value;
  const sem = ini && fim ? `Semana de ${ini} a ${fim}\n` : '';
  let msg = `🛒 *Lista de Supermercado — FaceMarket*\n${sem}\n`;
  COMPRAS.forEach((cat, ci) => {
    const marc = cat.items.filter((_,ii) => checked.has(`${ci}-${ii}`));
    if (!marc.length) return;
    msg += `\n*${cat.cat}*\n`;
    marc.forEach(it => { const ii = cat.items.indexOf(it); msg += `☐ ${it.n} — ${getQty(ci,ii)}\n`; });
  });
  if (!checked.size) msg += '\n_(Nenhum item marcado)_';
  window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
}

function waRefeicoes() {
  const ini = document.getElementById('rini').value;
  const fim = document.getElementById('rfim').value;
  const sem = ini && fim ? `Semana de ${ini} a ${fim}\n` : '';
  let msg = `🍽️ *Refeições da Semana — FaceMarket*\n${sem}\n`;
  DIAS.forEach((dia, di) => {
    const temAlgo = REFEICOES.some((sec, ri) => sec.items.some((_,ii) => refSel[ri][ii].has(di)));
    if (!temAlgo) return;
    msg += `\n📅 *${dia}*\n`;
    REFEICOES.forEach((sec, ri) => {
      const itens = sec.items.filter((_,ii) => refSel[ri][ii].has(di));
      if (!itens.length) return;
      msg += `${sec.ref}: ${itens.join(', ')}\n`;
    });
  });
  window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
}

function waAgenda() {
  const ini = document.getElementById('aini').value;
  const fim = document.getElementById('afim').value;
  const sem = ini && fim ? `Semana de ${ini} a ${fim}\n` : '';
  let msg = `📅 *Agenda da Semana — FaceMarket*\n${sem}\n`;
  DIAS.forEach((dia, di) => {
    const temAlgo = REFEICOES.some((sec, ri) => sec.items.some((_,ii) => refSel[ri][ii].has(di)));
    if (!temAlgo) return;
    msg += `\n*${dia}*\n`;
    REFEICOES.forEach((sec, ri) => {
      const itens = sec.items.filter((_,ii) => refSel[ri][ii].has(di));
      if (!itens.length) return;
      msg += `${sec.ref}: ${itens.join(', ')}\n`;
    });
  });
  window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
}

/* ── TABS ── */
function showTab(tab, btn) {
  ['compras','refeicoes','agenda'].forEach(t => {
    document.getElementById('tab-'+t).style.display = t===tab ? '' : 'none';
    document.getElementById('abar-'+t).style.display = t===tab ? '' : 'none';
  });
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  if (tab==='compras') renderCompras();
  if (tab==='agenda') renderAgenda();
}

/* INIT */
renderCompras();
renderDias();
renderRefeicoes();
renderAgenda();
</script>
</body>
</html>
